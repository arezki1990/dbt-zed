name: el-release

# Releases the EL daemon: zdbt-el-serve + zdbt-el-worker built from the
# standalone EL workspace (none of the IDE's dependencies), as tarballs
# per platform, plus the daemon image on GHCR.
#   git tag el-v0.1.0 && git push origin el-v0.1.0

on:
  push:
    tags:
      - "el-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "el-v* tag to (create and) upload to"
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  EL_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$EL_TAG" >/dev/null 2>&1 || gh release create "$EL_TAG" \
            --title "EL daemon $EL_TAG" \
            --notes "zdbt-el-serve + zdbt-el-worker. Install on a server: deploy/el-serve/install.sh (downloads the tarball for its platform). Image: ghcr.io/${{ github.repository_owner }}/zdbt-el-serve:$EL_TAG"

  binaries:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: linux-aarch64 }
          - { os: macos-15,         target: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake pkg-config libssl-dev python3
      - name: Standalone EL workspace
        run: python3 deploy/el-serve/standalone.py . "$RUNNER_TEMP/el"
      - name: Build
        working-directory: ${{ runner.temp }}/el
        run: cargo build --release -p el_serve -p el_worker
      - name: Package
        run: |
          out="zdbt-el-${{ matrix.target }}.tar.gz"
          tar -czf "$out" -C "$RUNNER_TEMP/el/target/release" zdbt-el-serve zdbt-el-worker
          shasum -a 256 "$out" > "$out.sha256"
          echo "asset=$out" >> "$GITHUB_ENV"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$EL_TAG" "$asset" "$asset.sha256" --clobber

  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/el-serve/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zdbt-el-serve:${{ env.EL_TAG }}
            ghcr.io/${{ github.repository_owner }}/zdbt-el-serve:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
