name: zdbt-release

on:
  push:
    tags:
      - "zdbt-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing zdbt-v* tag (release) to upload assets to; the dispatched ref is what gets built"
        required: true
      only:
        description: "Which platform to build"
        type: choice
        default: all
        options: [all, macos, linux, windows]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  ZDBT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  macos-aarch64:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'macos'
    runs-on: macos-15
    timeout-minutes: 360
    env:
      # When these secrets are configured, bundle-mac signs and notarizes the
      # app; while unset it produces an unsigned build (same script behavior).
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Bundle
        run: ./script/bundle-mac aarch64-apple-darwin
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls target/aarch64-apple-darwin/release/*.dmg | head -1)
          cp "$dmg" zdbt-macos-aarch64.dmg
          gh release upload "$ZDBT_TAG" zdbt-macos-aarch64.dmg --clobber

  linux-x86_64:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      # webrtc-sys needs clang 17+; the 22.04 image only ships clang 14.
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - name: Install clang 18
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt-llvm-org.asc >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
      - name: Install dependencies
        run: ./script/linux
      - name: Download WASI SDK
        run: ./script/download-wasi-sdk
      - name: Bundle
        run: ./script/bundle-linux
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball=$(ls target/release/*linux*.tar.gz | head -1)
          cp "$tarball" zdbt-linux-x86_64.tar.gz
          gh release upload "$ZDBT_TAG" zdbt-linux-x86_64.tar.gz --clobber

  windows-x86_64:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      ZED_WORKSPACE: ${{ github.workspace }}
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - name: Bundle
        shell: pwsh
        run: script/bundle-windows.ps1 -Architecture x86_64
      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem target\*.exe | Select-Object -First 1
          Copy-Item $exe.FullName zdbt-windows-x86_64-setup.exe
          gh release upload $env:ZDBT_TAG zdbt-windows-x86_64-setup.exe --clobber

  # Regenerates SHA256SUMS.txt from whatever the release actually holds, so the
  # checksums always match the published assets. Runs even when some platform
  # jobs were skipped (workflow_dispatch with `only`), because the assets from
  # earlier runs are still on the release and must stay covered.
  checksums:
    needs: [macos-aarch64, linux-x86_64, windows-x86_64]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Generate and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          gh release download "$ZDBT_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'zdbt-*' --clobber
          if [ -z "$(ls -A)" ]; then
            echo "::error::no zdbt-* assets on $ZDBT_TAG; nothing to checksum"
            exit 1
          fi
          sha256sum zdbt-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$ZDBT_TAG" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
