[package]
name = "el_worker"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[lints]
workspace = true

# The on-demand connector worker: database drivers compile HERE, never
# into the main zdbt binary. Distributed per platform and downloaded when
# a pipeline first references a database source.
[[bin]]
name = "zdbt-el-worker"
path = "src/main.rs"

[dependencies]
adbc_core = "=0.24.0"
adbc_driver_manager = "=0.24.0"
anyhow.workspace = true
duckdb.workspace = true
arrow-cast = "59"
arrow-ipc = "59"
el_engine = { workspace = true, features = ["duckdb", "postgres"] }
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
serde_json.workspace = true

[dev-dependencies]
futures.workspace = true
tempfile.workspace = true
