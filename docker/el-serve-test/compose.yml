# Test target for the "New server over SSH" wizard.
#   AUTHORIZED_KEY="$(cat ~/.ssh/id_ed25519.pub)" \
#     docker compose -f docker/el-serve-test/compose.yml up -d --build
# ssh:  deploy@127.0.0.1:2222      daemon (once installed): http://127.0.0.1:7432
services:
  el-serve-test:
    build: .
    container_name: el-serve-test
    environment:
      AUTHORIZED_KEY: ${AUTHORIZED_KEY:?export your public key as AUTHORIZED_KEY}
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:7432:7431"
    volumes:
      - el-serve-test-src:/opt/zdbt-src      # keeps the Rust build between restarts
      - el-serve-test-cargo:/root/.cargo
volumes:
  el-serve-test-src:
  el-serve-test-cargo:
