# A throwaway Oracle to test the connector against: Oracle Database 23ai
# Free, multi-arch (amd64 + arm64), seeded with a typed demo schema.
#   ORACLE_PASSWORD=sys-pw APP_USER_PASSWORD=zdbt-pw \
#     docker compose -f docker/oracle-test/compose.yml up -d --wait
# connect: 127.0.0.1:1521/FREEPDB1   user: zdbt   (see crates/el_engine/ORACLE.md)
# Tearing down: `down -v` also deletes the database files.
services:
  oracle-test:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: oracle-test
    environment:
      # SYS / SYSTEM. Required on first start.
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set a password for SYS}
      # The application user the tests connect as, created in FREEPDB1.
      APP_USER: zdbt
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?set a password for the zdbt user}
    ports:
      - "127.0.0.1:1521:1521"   # localhost only — this database has weak, shared credentials
    volumes:
      # Runs once, on the first start of an empty database.
      - ./initdb:/container-entrypoint-initdb.d:ro
      - oracle-test-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped
volumes:
  oracle-test-data:
