path = "benches/regression_write_cost.rs"

[[bench]]
name = "sqlite_v3_comparison"
path = "benches/sqlite_v3_comparison.rs"
harness = false

[[bench]]
name = "sqlite_v3_curated"
path = "benches/sqlite_v3_curated.rs"
harness = false

[[bench]]
name = "substrate_readpath"
path = "benches/substrate_readpath.rs"
harness = false

[[bench]]
name = "temporal_benchmarks"
path = "benches/temporal_benchmarks.rs"
harness = false

[[bench]]
name = "test_simple_bench"
path = "benches/test_simple_bench.rs"

[[bench]]
name = "v3_algorithm_benchmarks"
path = "benches/v3_algorithm_benchmarks.rs"
harness = false
required-features = ["native-v3"]

[[bench]]
name = "v3_backend_benchmarks"
path = "benches/v3_backend_benchmarks.rs"
harness = false
required-features = ["native-v3"]

[[bench]]
name = "wal_recovery_benchmarks"
path = "benches/wal_recovery_benchmarks.rs"
harness = false

[dependencies.ahash]
version = "0.8"

[dependencies.arc-swap]
version = "1"

[dependencies.bincode]
version = "1.3"

[dependencies.binrw]
version = "0.13"

[dependencies.bytemuck]
version = "1.13"
features = ["derive"]

[dependencies.chrono]
version = "0.4"

[dependencies.futures]
version = "0.3"

[dependencies.log]
version = "0.4"

[dependencies.lru]
version = "0.16.3"

[dependencies.memmap2]
version = "0.9"

[dependencies.parking_lot]
version = "0.12"

[dependencies.petgraph]
version = "0.6"

[dependencies.r2d2]
version = "0.8"

[dependencies.r2d2_sqlite]
version = "0.25"

[dependencies.rand]
version = "0.8"

[dependencies.rayon]
version = "1.10"

[dependencies.regex]
version = "1"

[dependencies.rusqlite]
version = "0.32"
features = ["bundled"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.sysinfo]
version = "0.30"

[dependencies.thiserror]
version = "1"

[dependencies.tokio]
version = "1"
features = [
    "fs",
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
]

[dependencies.turbovec]
version = "0.9"
optional = true

[dev-dependencies.assert_cmd]
version = "2"

[dev-dependencies.criterion]
version = "0.5"
features = ["html_reports"]

[dev-dependencies.nix]
version = "0.27"
features = [
    "fs",
    "process",
]

[dev-dependencies.rand]
version = "0.8"

[dev-dependencies.rustc_version]
version = "0.4"

[dev-dependencies.tempfile]
version = "3"

[target.'cfg(target_os = "linux")'.dependencies.rio]
version = "0.9"
